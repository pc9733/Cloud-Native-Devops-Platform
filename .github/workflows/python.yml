name: Python Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r aws-devops-platform/cloud-app/backend/requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 aws-devops-platform/cloud-app/backend/
      - name: Run tests
        run: |
          pytest aws-devops-platform/cloud-app/backend/
